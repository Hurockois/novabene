name: Avis de parution

on:
  push:
    branches: [main]
    paths: ['index.html', 'soir.html']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  avis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save web-push@3.6.7
      - run: node scripts/notify.mjs
        env:
          VAPID_PUBLIC_KEY: BF9gfswSyvT8N3wtlZpZvd7SxgS0RGHLCnigndNLXu4uTe-asJqwZAloe7YaerqDFpz6ZRQcl_L1TQlInWAr11k
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SUBSCRIPTIONS: ${{ secrets.PUSH_SUBSCRIPTIONS }}
